name: Validate Sub-Agent Templates

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'sub-agents/**'
      - '.github/scripts/validate_sub_agents.py'
      - 'docs/sub-agent-spec.md'
      - '.github/workflows/validate-sub-agents.yml'

permissions:
  contents: read

jobs:
  validate:
    name: validate-sub-agents
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml python-frontmatter

      - name: Run sub-agent validation script
        run: python .github/scripts/validate_sub_agents.py
