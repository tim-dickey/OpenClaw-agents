name: Lint Markdown (PR Changed Files)

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - ".markdownlintignore"
      - "package.json"
      - "scripts/lint-changed-markdown.ps1"

permissions:
  contents: read

jobs:
  markdownlint-changed:
    name: Lint changed markdown files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Get changed markdown files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.md
          files_ignore: |
            REFERENCE/**

      - name: Lint changed markdown files
        if: steps.changed.outputs.any_changed == 'true'
        run: npx markdownlint-cli2 ${{ steps.changed.outputs.all_changed_files }}

      - name: No markdown changes
        if: steps.changed.outputs.any_changed != 'true'
        run: echo "No changed markdown files to lint."
