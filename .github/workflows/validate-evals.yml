name: Validate Eval Fixtures

on:
  pull_request:
    paths:
      - 'evals/**'
      - '.github/scripts/validate_evals.py'
      - 'docs/eval-fixture-spec.md'
      - '.github/workflows/validate-evals.yml'
  push:
    branches: [main]
    paths:
      - 'evals/**'
      - '.github/scripts/validate_evals.py'
      - 'docs/eval-fixture-spec.md'
      - '.github/workflows/validate-evals.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate eval fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml python-frontmatter

      - name: Run eval fixture validation script
        run: python .github/scripts/validate_evals.py