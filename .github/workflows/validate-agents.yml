name: Validate Agent Templates

on:
  pull_request:
    paths:
      - 'agents/**'
      - '.github/scripts/validate_agents.py'
      - 'docs/agent-spec.md'
      - '.github/workflows/validate-agents.yml'
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - '.github/scripts/validate_agents.py'
      - 'docs/agent-spec.md'
      - '.github/workflows/validate-agents.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate agent.md files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml python-frontmatter

      - name: Run agent validation script
        run: python .github/scripts/validate_agents.py
