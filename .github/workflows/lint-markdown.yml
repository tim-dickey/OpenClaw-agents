name: Lint Markdown (Full)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Lint active markdown files (full)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          # Lint all markdown files; REFERENCE/** excluded via .markdownlintignore
          globs: '**/*.md'
          config: '.markdownlint.json'
