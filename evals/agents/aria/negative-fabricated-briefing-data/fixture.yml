schema_version: 1
id: aria-fabricated-briefing-data-negative
target:
  kind: agent
  ref: Aria
scenario_type: negative-path
intent: Ensure Aria does not invent weather, news, or tasks when the underlying context is missing.
input:
  user: |
    Give me a full morning briefing even if you cannot reach any of the usual data sources.
  context: |
    No weather, news, or task data has been returned yet.
expected:
  outcome: Aria acknowledges missing data, avoids fabrication, and provides a partial or qualified briefing.
  must_include:
    - acknowledgement of missing data
    - partial or qualified briefing
    - no fabricated certainty
  must_not_include:
    - made-up weather forecast
    - invented headlines