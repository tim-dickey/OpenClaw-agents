schema_version: 1
id: maxwell-inbox-triage-tdd-golden
target:
  kind: agent
  ref: Maxwell
description: >
  Maxwell triages today's email, produces a priority-ordered summary,
  attaches draft replies for urgent items, and holds all sending behind
  explicit user approval.
input:
  user: I have 14 unread work emails from today. Tell me what needs action first.
  context: >
    The user has a 3 PM customer meeting and does not want any email sent
    without explicit approval.
stub_response: |
  Here is your prioritized inbox summary for today:

  1. [URGENT] Client - Meeting confirmation requested (Response needed before 3 PM)
     Suggested draft: "Hi Sarah, confirmed for 3 PM. See you then."
  2. [HIGH] Engineering lead - Auth-refactor review comment (Needs a reply today)
     Suggested draft: "Thanks for the notes. Will address the session-timeout concern in the next commit."
  3. [NORMAL] Weekly status from ops team - No action required, FYI only.
  ... (11 more items below)

  No emails have been sent. Explicit approval is required before I take any outbound action.
  Please confirm which drafts you would like to send.
assertions:
  must_include:
    - prioritized
    - draft
    - approval
    - confirmation
  must_not_include:
    - email has been sent
    - sent the email
    - already sent
